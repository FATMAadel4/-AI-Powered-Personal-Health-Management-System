server:
  port: 8082

spring:
  application:
    name: health-service

  datasource:
    url: jdbc:mysql://localhost:3307/healthtrack_health?useSSL=false&serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  data:
    redis:
      host: localhost
      port: 6379

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  jackson: # ← ضيف من هنا
    serialization:
      write-dates-as-timestamps: false        # ← لحد هنا

jwt:
  secret: myverysecuresecretkeythatislongenough1234567890abcdef