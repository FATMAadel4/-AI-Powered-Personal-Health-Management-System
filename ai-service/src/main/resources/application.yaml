server:
  port: 8083

spring:
  application:
    name: ai-service
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

jwt:
  secret: ${JWT_SECRET}

openai:
  api-key: ${OPENAI_API_KEY}
  model: gpt-4o-mini

chroma:
  url: http://chromadb:8000
  collection: health-reports

logging:
  level:
    root: INFO
    com.example.ai_service: DEBUG